name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version; blank increments latest patch'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        run: node scripts/release-version.mjs
        env:
          INPUT_VERSION: ${{ inputs.version }}
  companion:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build:companion
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: dist/companion-linux-x64.tar.gz
  build:
    needs: [version, companion]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: npm ci
      - name: Set shared release version
        run: npm version "$env:RELEASE_VERSION" --no-git-tag-version --allow-same-version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: companion
          path: dist
      - run: npm run build
      - run: npm test
      - run: npm run test:system
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ubuntu 24.04 blocks Chromium's user-namespace sandbox without the AppArmor profile the deb installs.
      # Use Chromium's setuid sandbox helper instead (the deb's fallback) so the smoke test still runs sandboxed.
      - name: Packaged smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/smoke-package.mjs
      - name: Packaged smoke test
        if: runner.os != 'Linux'
        run: node scripts/smoke-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
  # GitHub-hosted Windows runners cannot run WSL 2, so this needs a prepared self-hosted runner.
  # It runs only when the repository variable DEVENV_WSL_RUNNER is 'true'; until then releases ship without it.
  wsl:
    if: vars.DEVENV_WSL_RUNNER == 'true'
    needs: [version, companion]
    runs-on: [self-hosted, Windows, X64, devenv-wsl2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: companion
          path: dist
      - run: npm run build
      - run: npx vitest run tests/wsl-integration.test.ts
        env:
          DEVENV_TEST_WSL: '1'
          DEVENV_TEST_VERSION: ${{ needs.version.outputs.version }}
  publish:
    needs: [version, build, wsl]
    # A skipped (disabled) WSL job must not block publishing; a failed one still does.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.wsl.result == 'success' || needs.wsl.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Devenv v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packages/*.dmg
            packages/*.zip
            packages/*.exe
            packages/*.deb
            packages/*.AppImage
