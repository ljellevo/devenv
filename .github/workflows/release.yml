name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0); blank increments the latest patch'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Choose release version
        id: version
        run: node scripts/release-version.mjs
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Set app version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - run: npm test
      - name: Verify native process inspection and lifecycle
        run: npm run test:system
      - run: npm run build
      - name: Install UI test browser
        run: npx playwright install chromium
      - run: npm run test:ui
      - name: Package both Mac architectures
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Devenv v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
