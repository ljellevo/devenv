name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:system
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
